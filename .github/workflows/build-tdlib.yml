name: Build TDLib

# Build follows https://tdlib.github.io/td/build.html (official CMake + tdjson).
# Extra on top: OpenSSL/zlib statically merged into tdjson (static flags / triplets).
#
# ⚠️ 当前状态：**只构建 Android**（`build-android` job）。桌面五个平台暂时全部停用
#    （`desktop` 表里 `enabled: false`），恢复时把对应项改回 `true` 即可，别删表——
#    `crates/fuyubot-tdlib/tests/release_assets.rs` 会读这张表逐行比对 loader 的 `ASSET_*`。
#
# 两条互不干扰的产物：
#   - 桌面：`TDLib-<os>-<arch>`，是 **loader 的发布资产**（tag `TDLib-v<版本>`），走 `assemble` + Release。
#   - Android：`tdjson-android-<abi>`，**不是** loader 资产（loader 只认 windows/macos/linux），
#     只作为 workflow artifact 上传，不进 Release，也不参与 `SHA256SUMS` 契约。
#
# Windows / vcpkg PITFALL:
#   Use the runner's preinstalled vcpkg as-is (latest).
#   NEVER switch / pin / checkout a vcpkg branch or commit.

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: "TDLib version label used in package names (e.g. 1.8.0)"
        required: true
        type: string
      tdlib_commit:
        description: "Exact TDLib source commit SHA (40-character hexadecimal hash)"
        required: true
        type: string
      publish_release:
        description: "Publish/update the GitHub Release (requires all 5 desktop platforms enabled; turn OFF for Android-only builds)"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      tdlib_version:
        required: true
        type: string
      tdlib_commit:
        required: true
        type: string
      publish_release:
        required: false
        type: boolean
        default: true


permissions:
  contents: write

jobs:
  resolve-tdlib:
    name: Validate TDLib commit SHA
    runs-on: ubuntu-latest
    outputs:
      tdlib_version: ${{ steps.meta.outputs.tdlib_version }}
      tdlib_commit: ${{ steps.meta.outputs.tdlib_commit }}
      build_matrix: ${{ steps.meta.outputs.build_matrix }}
      build_count: ${{ steps.meta.outputs.build_count }}
      android_matrix: ${{ steps.meta.outputs.android_matrix }}
      android_count: ${{ steps.meta.outputs.android_count }}
      selected_targets: ${{ steps.meta.outputs.selected_targets }}
    steps:
      - name: Validate version and use supplied TDLib commit SHA
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.tdlib_version }}
          INPUT_COMMIT: ${{ inputs.tdlib_commit }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION//[[:space:]]/}"
          COMMIT="${INPUT_COMMIT//[[:space:]]/}"
          if [[ -z "$VERSION" ]]; then
            echo "error: tdlib_version must not be empty" >&2
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "error: tdlib_commit must be the full 40-character TDLib commit SHA; tags and branch names are not accepted" >&2
            exit 1
          fi
          VER="$VERSION"
          # ⚠️ tag 必须**精确**是 `TDLib-v<版本>`：fuyubot-tdlib 的 `release_url()` 拼的是
          #    https://github.com/<repo>/releases/download/TDLib-v<版本>/<资产名>
          TAG="TDLib-v${VER}"

          # ⚠️ `asset` 必须**精确等于** crates/fuyubot-tdlib/src/loader/vendored.rs 里 ASSETS 表的值
          #    ——`asset_name()` 的返回值原样拼进下载 URL（**不带扩展名**）。
          #    命名约定：`TDLib-<os>-<arch>`，其中 arch 用 cargo 口径（`aarch64`，不是 `arm64`）。
          #    注意矩阵里的 `arch` 是 CI 自己的口径（runner/打包/校验用），**不参与**资产名。
          #    crates/fuyubot-tdlib/tests/release_assets.rs 会读本文件逐行比对，漂了就红。
          #
          # ⚠️ 桌面五个平台**暂时全部停用**：`enabled: false`。
          #    停用项仍然留在矩阵里（不是注释掉），这样 release_assets.rs 的双向比对照样成立；
          #    真正决定「建不建」的是 build job 上的 `if: matrix.enabled`。
          #    恢复某个平台 = 把它的 `enabled` 改回 `true`；五个都 `true` 才能发布 Release。
          MATRIX="$(python3 - <<'PY'
          import json
          desktop = [
              {"platform": "linux", "arch": "x86_64", "runner": "ubuntu-22.04", "asset": "TDLib-linux-x86_64", "enabled": False},
              {"platform": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "asset": "TDLib-linux-aarch64", "enabled": False},
              {"platform": "macos", "arch": "arm64", "runner": "macos-14", "asset": "TDLib-macos-aarch64", "enabled": False},
              {"platform": "windows", "arch": "x86_64", "runner": "windows-latest", "asset": "TDLib-windows-x86_64", "enabled": False},
              {"platform": "windows", "arch": "arm64", "runner": "windows-11-vs2026-arm", "asset": "TDLib-windows-aarch64", "enabled": False},
          ]
          print(json.dumps({"include": desktop}, separators=(",", ":")))
          PY
          )"
          # Android：**不是** loader 的发布资产（loader 只认 windows/macos/linux），
          # 所以键名叫 `artifact` 而不是 `asset`——资产名故意不带 `TDLib-` 前缀，
          # 不进 Release、不参与 SHA256SUMS，只作为 workflow artifact 上传。
          # `arch` 仍是 cargo 口径（aarch64 / x86_64），`abi` 是 NDK 的 ABI 名。
          ANDROID_MATRIX="$(python3 - <<'PY'
          import json
          android = [
              {"platform": "android", "arch": "aarch64", "abi": "arm64-v8a", "target": "aarch64-linux-android", "runner": "ubuntu-22.04", "artifact": "tdjson-android-arm64-v8a", "enabled": True},
              {"platform": "android", "arch": "x86_64", "abi": "x86_64", "target": "x86_64-linux-android", "runner": "ubuntu-22.04", "artifact": "tdjson-android-x86_64", "enabled": True},
          ]
          print(json.dumps({"include": android}, separators=(",", ":")))
          PY
          )"
          COUNT="$(python3 -c 'import json,sys; print(sum(1 for x in json.loads(sys.argv[1])["include"] if x.get("enabled")))' "$MATRIX")"
          ANDROID_COUNT="$(python3 -c 'import json,sys; print(sum(1 for x in json.loads(sys.argv[1])["include"] if x.get("enabled")))' "$ANDROID_MATRIX")"
          if [[ "$PUBLISH_RELEASE" == "true" && "$COUNT" -ne 5 ]]; then
            echo "error: publishing/updating the GitHub Release requires all 5 desktop platforms enabled (currently $COUNT);" >&2
            echo "       Android-only / partial builds must set publish_release=false" >&2
            exit 1
          fi
          TARGETS="$(python3 -c '
          import json,sys
          out = []
          for raw in sys.argv[1:]:
              for x in json.loads(raw)["include"]:
                  if x.get("enabled"):
                      out.append(x["platform"] + "-" + x.get("abi", x["arch"]))
          print(", ".join(out))
          ' "$MATRIX" "$ANDROID_MATRIX")"
          {
            echo "tdlib_version=$VERSION"
            echo "tdlib_commit=$COMMIT"
            echo "build_matrix=$MATRIX"
            echo "build_count=$COUNT"
            echo "android_matrix=$ANDROID_MATRIX"
            echo "android_count=$ANDROID_COUNT"
            echo "selected_targets=$TARGETS"
          } >> "$GITHUB_OUTPUT"
          echo "using version=$VERSION commit=$COMMIT release_tag=$TAG"
          echo "enabled desktop platforms: $COUNT / 5"
          echo "enabled android abis: $ANDROID_COUNT"
          echo "selected targets: $TARGETS"

  export-schema:
    name: Export td_api.tl
    needs: resolve-tdlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch td_api.tl from TDLib at resolved commit
        env:
          COMMIT: ${{ needs.resolve-tdlib.outputs.tdlib_commit }}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:?}"
          TDLIB_DIR="$WS/td-src"
          OUT_DIR="$WS/schema-out"
          export COMMIT

          rm -rf "$TDLIB_DIR" "$OUT_DIR"
          mkdir -p "$TDLIB_DIR" "$OUT_DIR"

          # Prefer GitHub archive (no git SHA fetch pitfalls)
          ARCHIVE="$WS/td-src.tar.gz"
          if curl -fsSL "https://github.com/tdlib/td/archive/${COMMIT}.tar.gz" -o "$ARCHIVE"; then
            tar -xzf "$ARCHIVE" -C "$TDLIB_DIR" --strip-components=1
            rm -f "$ARCHIVE"
          else
            echo "==> archive download failed; falling back to git clone"
            git clone --filter=blob:none https://github.com/tdlib/td.git "$TDLIB_DIR"
            git -C "$TDLIB_DIR" fetch --depth 1 origin "$COMMIT"
            git -C "$TDLIB_DIR" checkout --detach "$COMMIT"
          fi

          SCHEMA_SRC="$TDLIB_DIR/td/generate/scheme/td_api.tl"
          if [[ ! -f "$SCHEMA_SRC" ]]; then
            echo "error: missing $SCHEMA_SRC" >&2
            find "$TDLIB_DIR" -name 'td_api.tl' 2>/dev/null | head || true
            exit 1
          fi
          cp "$SCHEMA_SRC" "$OUT_DIR/td_api.tl"

          echo "==> schema-out contents:"
          ls -la "$OUT_DIR"
          wc -l "$OUT_DIR/td_api.tl"
          test -s "$OUT_DIR/td_api.tl"

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-schema-${{ needs.resolve-tdlib.outputs.tdlib_version }}
          path: schema-out/*
          if-no-files-found: error
          retention-days: 90

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: resolve-tdlib
    # 暂时只建 Android：桌面五项在 resolve 的 `desktop` 表里都是 `enabled: false`，
    # 于是这里整批 skip（不是从矩阵里删掉，release_assets.rs 的比对照旧有效）。
    if: matrix.enabled
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-tdlib.outputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout TDLib source
        shell: bash
        env:
          COMMIT: ${{ needs.resolve-tdlib.outputs.tdlib_commit }}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:?}"
          TDLIB_DIR="$WS/td-src"
          rm -rf "$TDLIB_DIR"
          git clone --filter=blob:none https://github.com/tdlib/td.git "$TDLIB_DIR"
          git -C "$TDLIB_DIR" fetch --depth 1 origin "$COMMIT"
          git -C "$TDLIB_DIR" checkout --detach "$COMMIT"
          ACTUAL="$(git -C "$TDLIB_DIR" rev-parse HEAD)"
          {
            echo "tdlib_commit=$ACTUAL"
            echo "TDLIB_COMMIT=$ACTUAL"
          } >> "$GITHUB_ENV"
          echo "Checked out TDLib ${ACTUAL}"
          test -f "$TDLIB_DIR/td/generate/scheme/td_api.tl"

          # eilvelia/tdl static-merge extra (not in official docs): --exclude-libs,ALL
          # can prevent static openssl/zlib from being merged into tdjson.
          if [[ -f "$TDLIB_DIR/CMake/TdSetUpCompiler.cmake" ]]; then
            sed -i 's/-Wl,--gc-sections -Wl,--exclude-libs,ALL/-Wl,--gc-sections/g' \
              "$TDLIB_DIR/CMake/TdSetUpCompiler.cmake" || true
          fi

      - name: Make scripts executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x .github/scripts/*.sh

      # ---------------- Linux ----------------
      - name: Build TDLib (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-tdlib.outputs.tdlib_version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p out/tdjson dist
          # Official: cmake Release + prepare_cross_compiling + tdjson
          # Extra: static OpenSSL/zlib from apt (libssl-dev/zlib1g-dev .a files)
          .github/scripts/build-tdlib-linux.sh \
            "$GITHUB_WORKSPACE/td-src" \
            "$GITHUB_WORKSPACE/out" \
            "$ARCH"
          .github/scripts/package-tdlib.sh \
            "$GITHUB_WORKSPACE/out/tdjson" \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            linux \
            "$ARCH" \
            "$VERSION" \
            "$TDLIB_COMMIT" \
            "${{ matrix.asset }}"
          .github/scripts/verify-tdlib.sh \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            linux \
            "$ARCH" \
            "${{ matrix.asset }}"

      # ---------------- macOS ----------------
      - name: Build TDLib (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-tdlib.outputs.tdlib_version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p out/tdjson dist
          # Official: brew gperf/openssl/cmake + cmake Release + tdjson
          # Extra: static merge into libtdjson.dylib
          .github/scripts/build-tdlib-macos.sh \
            "$GITHUB_WORKSPACE/td-src" \
            "$GITHUB_WORKSPACE/out" \
            "$ARCH"
          .github/scripts/package-tdlib.sh \
            "$GITHUB_WORKSPACE/out/tdjson" \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            macos \
            "$ARCH" \
            "$VERSION" \
            "$TDLIB_COMMIT" \
            "${{ matrix.asset }}"
          .github/scripts/verify-tdlib.sh \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            macos \
            "$ARCH" \
            "${{ matrix.asset }}"

      # ---------------- Windows ----------------
      - name: Setup vcpkg and install dependencies (Windows x64)
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE/td-src"
          git clone https://github.com/Microsoft/vcpkg.git
          Set-Location vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install gperf:x64-windows-static openssl:x64-windows-static zlib:x64-windows-static

      - name: Setup vcpkg and install dependencies (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE/td-src"
          git clone https://github.com/Microsoft/vcpkg.git
          Set-Location vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install gperf:x64-windows-static openssl:arm64-windows-static zlib:arm64-windows-static

      - name: Build TDLib shared library (Windows x64)
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE/td-src"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          cmake -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH=../tdlib `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTD_ENABLE_OPENSSL_STATIC=ON `
            -DTD_ENABLE_ZLIB_STATIC=ON `
            -DBUILD_SHARED_LIBS=ON `
            ..
          cmake --build . --target install --config Release

      - name: Build TDLib shared library (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE/td-src"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build

          # gperf is a build-host tool, so it is installed for the x64 host triplet.
          # vcpkg does not reliably add this executable to PATH when the target is ARM64;
          # pass its path explicitly to TDLib's CMake configure step.
          $gperf = Join-Path "$env:GITHUB_WORKSPACE/td-src/vcpkg" "installed/x64-windows-static/tools/gperf/gperf.exe"
          if (-not (Test-Path $gperf -PathType Leaf)) {
            Get-ChildItem "$env:GITHUB_WORKSPACE/td-src/vcpkg/installed" -Filter gperf.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "gperf.exe not found at expected vcpkg host-tools path: $gperf"
          }

          # Run this build on a native Windows ARM64 runner so TDLib's generated
          # helper executables are ARM64-native and can execute during the build.
          cmake -A ARM64 `
            -DCMAKE_INSTALL_PREFIX:PATH=../tdlib `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=arm64-windows-static `
            "-DGPERF_EXECUTABLE:FILEPATH=$gperf" `
            -DTD_ENABLE_OPENSSL_STATIC=ON `
            -DTD_ENABLE_ZLIB_STATIC=ON `
            -DBUILD_SHARED_LIBS=ON `
            ..
          cmake --build . --target install --config Release

      - name: Copy TDLib.dll to dist
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE"
          New-Item -ItemType Directory -Force -Path out/tdjson | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dll = Get-ChildItem 'td-src/tdlib/bin/*.dll' -File | Select-Object -First 1
          if (-not $dll) { throw 'TDLib DLL was not found under td-src/tdlib/bin' }
          Copy-Item $dll.FullName "out/tdjson/$($dll.Name)" -Force

      - name: Package TDLib (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-tdlib.outputs.tdlib_version }}"
          ARCH="${{ matrix.arch }}"
          COMMIT="${{ needs.resolve-tdlib.outputs.tdlib_commit }}"
          # tar.gz，**不是 zip**：loader 的 extract_library 只认裸库和 .tar.gz。
          .github/scripts/package-tdlib.sh \
            "$GITHUB_WORKSPACE/out/tdjson" \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            windows "$ARCH" "$VERSION" "$COMMIT" "${{ matrix.asset }}"

      - name: Verify TDLib (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Each GitHub Actions run step starts a fresh shell; define ARCH here.
          ARCH="${{ matrix.arch }}"
          .github/scripts/verify-tdlib.sh \
            "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" \
            windows "$ARCH" "${{ matrix.asset }}"
      - name: Upload TDLib artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ needs.resolve-tdlib.outputs.tdlib_version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------- Android ----------------
  # 与桌面 job 分开：Android 是**交叉编译**，而且产物不是 loader 的发布资产
  # （`tdjson-android-<abi>`，只进 workflow artifact，不进 Release / SHA256SUMS）。
  # 所以它既不参与 `build_count`，也不参与 `release_assets.rs` 那条资产契约。
  build-android:
    name: android-${{ matrix.abi }}
    needs: resolve-tdlib
    if: matrix.enabled
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-tdlib.outputs.android_matrix) }}
    env:
      # NDK r28c；本机（Windows 侧）装的是同一个 revision，本地模拟能用同一套参数。
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_API_LEVEL: "21"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # gperf + g++ 是为了**host 侧生成源码**：交叉编译时 `prepare_cross_compiling`
          # 目标不存在（CMakeLists 里被 `if (NOT CMAKE_CROSSCOMPILING)` 包着），
          # 而 `td/generate/auto/**` 不入库，必须先让主机把它跑出来。
          # `perl` 是 OpenSSL 的 `./Configure` 硬依赖（runner 镜像自带，但缺了报错很难懂）；
          # `make` 是 `cmake --build`（Unix Makefiles）要用的。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gperf g++ make perl cmake ninja-build ca-certificates curl

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null || true
          fi
          if [[ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo "error: NDK $ANDROID_NDK_VERSION 没装上（$NDK）" >&2
            ls -la "$SDK/ndk" >&2 || true
            exit 1
          fi
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          echo "==> NDK $(sed -n 's/^Pkg\.Revision *= *//p' "$NDK/source.properties")"
          # OpenSSL 的 15-android.conf 也认这个变量名（脚本里三个名字都导出）。
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Checkout TDLib source
        shell: bash
        env:
          COMMIT: ${{ needs.resolve-tdlib.outputs.tdlib_commit }}
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:?}"
          TDLIB_DIR="$WS/td-src"
          rm -rf "$TDLIB_DIR"
          git clone --filter=blob:none https://github.com/tdlib/td.git "$TDLIB_DIR"
          git -C "$TDLIB_DIR" fetch --depth 1 origin "$COMMIT"
          git -C "$TDLIB_DIR" checkout --detach "$COMMIT"
          ACTUAL="$(git -C "$TDLIB_DIR" rev-parse HEAD)"
          echo "TDLIB_COMMIT=$ACTUAL" >> "$GITHUB_ENV"
          echo "Checked out TDLib ${ACTUAL}"
          test -f "$TDLIB_DIR/td/generate/scheme/td_api.tl"
          # 与桌面一致：去掉 --exclude-libs,ALL，让静态 OpenSSL 真的并进 tdjson。
          if [[ -f "$TDLIB_DIR/CMake/TdSetUpCompiler.cmake" ]]; then
            sed -i 's/-Wl,--gc-sections -Wl,--exclude-libs,ALL/-Wl,--gc-sections/' \
              "$TDLIB_DIR/CMake/TdSetUpCompiler.cmake" || true
          fi

      - name: Make scripts executable
        shell: bash
        run: chmod +x .github/scripts/*.sh

      - name: Build TDLib tdjson (Android)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out dist
          # 脚本内部：host 生成源码 → 静态 OpenSSL(NDK) → cmake(android.toolchain.cmake) → tdjson
          .github/scripts/build-tdlib-android.sh \
            "$GITHUB_WORKSPACE/td-src" \
            "$GITHUB_WORKSPACE/out" \
            "${{ matrix.abi }}"

      - name: Package TDLib (Android)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-tdlib.outputs.tdlib_version }}"
          # 注意用 `matrix.artifact`（不是 `matrix.asset`）：Android 不是 loader 资产。
          .github/scripts/package-tdlib.sh \
            "$GITHUB_WORKSPACE/out/tdjson" \
            "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}" \
            android \
            "${{ matrix.arch }}" \
            "$VERSION" \
            "$TDLIB_COMMIT" \
            "${{ matrix.artifact }}"

      - name: Verify TDLib (Android)
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/verify-tdlib.sh \
            "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}" \
            android \
            "${{ matrix.arch }}" \
            "${{ matrix.artifact }}"

      - name: Upload TDLib artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ needs.resolve-tdlib.outputs.tdlib_version }}-android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------- Android 框架本体（可执行文件，不是 apk）----------------
  # 复用上面刚编出来的 tdjson（同一次运行的 artifact），把 fuyubot 交叉编译成
  # **Android 可执行文件**（`aarch64-linux-android` / `x86_64-linux-android` 的 ELF）。
  # 包里是 `fuyubot` + **同级**的 `libtdjson.so` + `plugins/`：
  # loader 的优先级 2b（可执行文件目录，靠 `/proc/self/exe`）负责找到 tdjson，
  # 所以整个目录搬到设备上（Termux / adb push）就能跑，不需要碰系统库。
  #
  # 与 release-bot.yml 的关系：那边是 `.tdlib-cache/<版本>/<os>-<arch>/` 这个约定布局让
  # `fuyubot-tdlib/build.rs` 把库拷到可执行文件旁边；这里**同一套布局**，只是库来自本次运行的
  # artifact（Android 的 tdjson 还不是 Release 资产，见 `vendored.rs` 里 ASSETS 的注释）。
  build-framework-android:
    name: fuyubot-${{ matrix.arch }}
    needs: [resolve-tdlib, build-android]
    if: matrix.enabled && needs.build-android.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-tdlib.outputs.android_matrix) }}
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_API_LEVEL: "21"
      CARGO_TERM_COLOR: always
      TDLIB_VERSION: ${{ needs.resolve-tdlib.outputs.tdlib_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # 这一步只编 Rust（tdjson 已经由上一个 job 建好），但依赖树里有 C 代码
          # （`fuyubot-tdlib-sys` 的 build-dependency `ureq` → `ring`，按 **host** 编译），
          # 所以要有 host 的 cc/ld。runner 镜像自带，这里显式写出来免得换镜像时踩空。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential ca-certificates

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null || true
          fi
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download the Android tdjson built in this run
        uses: actions/download-artifact@v4
        with:
          name: tdlib-${{ needs.resolve-tdlib.outputs.tdlib_version }}-android-${{ matrix.abi }}
          path: tdjson-artifact

      - name: Stage tdjson into the build cache layout
        shell: bash
        run: |
          set -euo pipefail
          # 布局必须与 `vendored::relative_library_dir()` 一致：<缓存根>/<版本>/<os>-<arch>
          dest=".tdlib-cache/${TDLIB_VERSION}/android-${{ matrix.arch }}"
          mkdir -p "$dest" tdjson-artifact/unpacked
          tar -xzf "tdjson-artifact/${{ matrix.artifact }}" -C tdjson-artifact/unpacked
          cp -a "tdjson-artifact/unpacked/${{ matrix.artifact }}/." "$dest/"
          ls -lh "$dest"

      - name: Make scripts executable
        shell: bash
        run: chmod +x .github/scripts/*.sh

      - name: Build fuyubot for Android
        shell: bash
        env:
          FUYUBOT_TDLIB_VENDORED_CACHE: ${{ github.workspace }}/.tdlib-cache
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          triple="${{ matrix.target }}"
          # cargo 的 linker 环境变量名是 `CARGO_TARGET_<TRIPLE 大写下划线>_LINKER`。
          upper="$(printf '%s' "$triple" | tr 'a-z-' 'A-Z_')"
          linker="$toolchain/bin/${triple}${ANDROID_API_LEVEL}-clang"
          export "CARGO_TARGET_${upper}_LINKER=$linker"
          # cc-rs 的变量名是 `CC_<triple 下划线>`（当前依赖图里没有 crate 用它，留着不吃亏）
          export "CC_${triple//-/_}=$linker"
          export "AR_${triple//-/_}=$toolchain/bin/llvm-ar"
          echo "==> linker: $linker"
          cargo build --release --target "$triple" \
            -p fuyubot-cli \
            -p fuyubot-plugin-start -p fuyubot-plugin-help -p fuyubot-plugin-manage
          ls -lh "target/$triple/release/fuyubot"

      - name: Package fuyubot for Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          .github/scripts/package-bot-android.sh \
            "${{ matrix.target }}" "${{ matrix.arch }}" "$TDLIB_VERSION" \
            "${{ needs.resolve-tdlib.outputs.tdlib_commit }}" dist

      - name: Upload fuyubot artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: fuyubot-${{ needs.resolve-tdlib.outputs.tdlib_version }}-android-${{ matrix.abi }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release bundle
    needs: [resolve-tdlib, export-schema, build]
    if: ${{ always() && needs.build.result == 'success' && needs.export-schema.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all TDLib artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tdlib-${{ needs.resolve-tdlib.outputs.tdlib_version }}-*
          merge-multiple: true

      - name: Download schema artifact
        uses: actions/download-artifact@v4
        with:
          name: tdlib-schema-${{ needs.resolve-tdlib.outputs.tdlib_version }}
          path: schema

      - name: Normalize layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # 资产名没有扩展名（就是 loader 的 ASSET_*），所以按名字前缀收集。
          find artifacts -type f -name 'TDLib-*' -exec cp -v {} dist/ \;
          # Schema assets required for Publish Rust crate gating
          if [[ ! -f schema/td_api.tl ]]; then
            echo "error: schema/td_api.tl missing from schema artifact" >&2
            find schema -type f >&2 || true
            exit 1
          fi
          cp schema/td_api.tl dist/td_api.tl
          echo "==> dist contents"
          ls -lah dist
          COUNT="$(find dist -type f -name 'TDLib-*' | wc -l)"
          echo "==> found $COUNT package(s)"
          EXPECTED="${{ needs.resolve-tdlib.outputs.build_count }}"
          if [[ "$COUNT" -lt "$EXPECTED" ]]; then
            echo "error: expected $EXPECTED selected platform packages, found $COUNT" >&2
            find artifacts -type f >&2 || true
            exit 1
          fi
          test -f dist/td_api.tl
          # 校验表：构建期下载用 `SHA256SUMS` 校验资产（缺口 14），所以它必须由 CI 产出。
          # 顺序固定（TDLib-* 在前、td_api.tl 在后），表里只放这次真的会上传的文件。
          (cd dist && sha256sum TDLib-* td_api.tl > SHA256SUMS)
          echo "==> SHA256SUMS"
          cat dist/SHA256SUMS

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ needs.resolve-tdlib.outputs.tdlib_version }}-all
          path: |
            dist/TDLib-*
            dist/td_api.tl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Create / update GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-tdlib.outputs.tdlib_version }}
          COMMIT: ${{ needs.resolve-tdlib.outputs.tdlib_commit }}
          BUILD_MATRIX: ${{ needs.resolve-tdlib.outputs.build_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          # 与 loader 的 `release_url()` 一致：tag 是 `TDLib-v<版本>`（不含空格）。
          TAG="TDLib-v${VER}"
          TITLE="TDLib V${VER}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          NOTES="$(mktemp)"
          {
            echo "# ${TITLE}"
            echo
            echo "TDLib prebuilt binaries + schema for fuyubot."
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Release tag | \`${TAG}\` |"
            echo "| TDLib version | \`${VER}\` |"
            echo "| TDLib commit | \`${COMMIT:-resolved from ref}\` |"
            echo "| Build run | \`${RUN_URL}\` |"
            echo "| Linkage | OpenSSL/zlib **statically merged into tdjson** |"
            echo "| Schema | \`td_api.tl\` |"
            echo
            echo "## Packages"
            echo
            echo "| Platform | Arch | Archive | Directory inside archive | Dynamic library |"
            echo "|----------|------|---------|--------------------------|-----------------|"
            python3 - "$BUILD_MATRIX" <<'PY' >> "$NOTES"
          import json, sys
          matrix = json.loads(sys.argv[1])
          libraries = {"linux": "libtdjson.so", "macos": "libtdjson.dylib", "windows": "tdjson.dll"}
          # 资产名与归档内容由 matrix.asset 决定（= loader 的 ASSET_*，不带扩展名）。
          for item in matrix["include"]:
              platform, arch, asset = item["platform"], item["arch"], item["asset"]
              print(f"| {platform} | {arch} | `{asset}` | `{asset}/` | `{libraries[platform]}` |")
          PY
            echo
            echo "Each package contains only \`tdjson\` (+ \`VERSION.json\` / README)."
            echo "No separate \`libssl\` / \`libcrypto\` / \`libz\` runtime files."
            echo
            echo "Also attached: \`td_api.tl\`（构建期转换用，loader 不下载它）。"
            echo
            echo "\`SHA256SUMS\` covers every attached package + \`td_api.tl\`; build scripts verify downloads against it."
            echo
            echo "## Schema / bindings"
            echo
            echo "\`td_api.tl\` on this release is the schema \`fuyubot-tdlib\` converts at **build time**"
            echo "(it is baked into the binary as \`TdApiSchema::compiled()\`, so the runtime never parses it)."
            echo
            echo "## Rebuild policy"
            echo
            echo "Re-running this workflow for the **same** \`${TITLE}\` **updates** this release in place."
            echo
            echo "fuyubot loads \`tdjson\` **dynamically at runtime** (\`fuyubot-tdlib::loader\`)."
          } > "$NOTES"

          # Upload the plain, uncompressed schema first so it is easy to find on the Release page.
          UPLOAD=()
          [[ -f dist/td_api.tl ]] && UPLOAD+=("dist/td_api.tl")
          [[ -f dist/SHA256SUMS ]] && UPLOAD+=("dist/SHA256SUMS")
          for f in dist/TDLib-*; do
            [[ -f "$f" ]] && UPLOAD+=("$f")
          done
          if [[ ${#UPLOAD[@]} -eq 0 ]]; then
            echo "error: no release assets found under dist/" >&2
            ls -la dist || true
            exit 1
          fi
          echo "==> release tag: $TAG"
          echo "==> assets:"
          printf '  %s\n' "${UPLOAD[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> Release ${TAG} exists — update in place"
            gh release view "$TAG" --json assets -q '.assets[].id' | while read -r asset_id; do
              [[ -z "$asset_id" ]] && continue
              echo "    delete asset id=$asset_id"
              gh release delete-asset "$TAG" "$asset_id" -y
            done
            gh release upload "$TAG" "${UPLOAD[@]}" --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
            echo "==> Release updated: tag=$TAG title=$TITLE"
          else
            echo "==> Create release ${TAG}"
            gh release create "$TAG" "${UPLOAD[@]}" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
            echo "==> Release created: tag=$TAG title=$TITLE"
          fi

          echo "==> Release after publish:"
          gh release view "$TAG" --json assets,tagName,name \
            -q '{tag:.tagName,name:.name,assets:[.assets[].name]}'

  summary:
    name: Summary
    needs: [resolve-tdlib, export-schema, build, build-android, build-framework-android, assemble]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          VERSION: ${{ needs.resolve-tdlib.outputs.tdlib_version }}
          COMMIT: ${{ needs.resolve-tdlib.outputs.tdlib_commit }}
          BUILD_MATRIX: ${{ needs.resolve-tdlib.outputs.build_matrix }}
          ANDROID_MATRIX: ${{ needs.resolve-tdlib.outputs.android_matrix }}
          BUILD: ${{ needs.build.result }}
          ANDROID_BUILD: ${{ needs.build-android.result }}
          FRAMEWORK_BUILD: ${{ needs.build-framework-android.result }}
          ASSEMBLE: ${{ needs.assemble.result }}
          SCHEMA: ${{ needs.export-schema.result }}
          PUBLISH: ${{ inputs.publish_release }}
          TARGETS: ${{ needs.resolve-tdlib.outputs.selected_targets }}
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          {
            echo "## TDLib build summary"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| TDLib version | \`${VERSION}\` |"
            echo "| TDLib commit | \`${COMMIT:-n/a}\` |"
            # ⚠️ tag 必须与 loader 的 release_url() 一致（AGENTS 约束 46）。
            echo "| Release tag | \`TDLib-v${VER}\` |"
            echo "| Publish | \`${PUBLISH}\` |"
            echo "| Selected targets | \`${TARGETS}\` |"
            echo "| Schema export | \`${SCHEMA}\` |"
            echo "| Desktop matrix builds | \`${BUILD}\` |"
            echo "| Android tdjson | \`${ANDROID_BUILD}\` |"
            echo "| Android fuyubot | \`${FRAMEWORK_BUILD}\` |"
            echo "| Assemble | \`${ASSEMBLE}\` |"
            echo
            echo "Release assets: \`td_api.tl\` + per-platform \`TDLib-*\` packages + \`SHA256SUMS\`."
            echo
            echo "Android 的两份产物都只是 workflow artifact，**不进** Release："
            echo "\`tdjson-android-<abi>\`（动态库）与 \`fuyubot-<版本>-android-<abi>\`（可执行文件 + 同级 tdjson + plugins/）。"
            echo "loader 的 \`ASSETS\` 表仍只覆盖 windows / macos / linux。"
            echo
            echo "### Desktop matrix"
            echo
            echo "| Platform | Arch | Runner | Asset | Enabled |"
            echo "|----------|------|--------|-------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"
          # 从 matrix 现算，不手抄：手抄过一次，arm64 那行写的是 windows-latest，
          # 而 matrix 里其实是另一个 label——两边直接对不上。
          python3 - "$BUILD_MATRIX" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          matrix = json.loads(sys.argv[1])
          for item in matrix["include"]:
              enabled = "yes" if item.get("enabled", True) else "**no** (temporarily off)"
              print(f"| {item['platform']} | {item['arch']} | {item['runner']} | `{item['asset']}` | {enabled} |")
          print()
          print("### Android matrix")
          print()
          print("| ABI | Arch | Runner | Artifact | Enabled |")
          print("|-----|------|--------|----------|---------|")
          PY
          python3 - "$ANDROID_MATRIX" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          matrix = json.loads(sys.argv[1])
          for item in matrix["include"]:
              enabled = "yes" if item.get("enabled", True) else "no"
              print(f"| `{item['abi']}` | {item['arch']} | {item['runner']} | `{item['artifact']}` | {enabled} |")
          PY
