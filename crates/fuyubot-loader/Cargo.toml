[package]
name = "fuyubot-loader"
description = "宿主运行时、HostApi VTable 实现与插件加载器"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
# 只给 `#[tokio::test]` 的 async 响应等待用例（缺口 10）；运行时不直接依赖 tokio。
tokio.workspace = true

[dependencies]
fuyubot-abi.workspace = true
fuyubot-core.workspace = true
fuyubot-event.workspace = true
fuyubot-middleware.workspace = true
fuyubot-service.workspace = true
# 宿主侧跑 simplify 的 op 表（ABI v5 `simplify_invoke`）：与 Rust 插件共用同一份实现，
# 所以跨语言的行为不会有第二套。方向是 loader → simplify，没有回边。
fuyubot-simplify.workspace = true
fuyubot-tdlib.workspace = true
fuyubot-tool.workspace = true
libloading.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
